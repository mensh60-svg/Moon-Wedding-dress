<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام الجيم</title>
<meta name="theme-color" content="#1D3D8F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الجيم">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>:root{--bg:#F3F5F9;--surface:#FFFFFF;--soft:#EEF1F7;--ink:#141B2D;--mute:#667085;--line:#E1E6EF;--ac:#1D3D8F;--ac2:#E6ECFA;--hi:#FF6B2C;--hibg:#FFF0E8;--grn:#12805C;--grnbg:#E3F5EE;--red:#C4372C;--redbg:#FDECEA;--org:#A15C07;--orgbg:#FEF3E2;--blu:#1D5FA8;--blubg:#E7F0FA;--sh:0 4px 16px rgba(20,27,45,.07);--r:16px}
:root[data-theme="dark"]{--bg:#0E1220;--surface:#171C2D;--soft:#1F2538;--ink:#EEF1F7;--mute:#98A2B3;--line:#2A3148;--ac:#8EA8F0;--ac2:#232C47;--hi:#FF8A56;--hibg:#3A2418;--grn:#4CC79A;--grnbg:#16302A;--red:#F07167;--redbg:#3A1C1C;--org:#F5B454;--orgbg:#3A2A12;--blu:#7EB2EE;--blubg:#16263A;--sh:0 4px 16px rgba(0,0,0,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1220;--surface:#171C2D;--soft:#1F2538;--ink:#EEF1F7;--mute:#98A2B3;--line:#2A3148;--ac:#8EA8F0;--ac2:#232C47;--hi:#FF8A56;--hibg:#3A2418;--grn:#4CC79A;--grnbg:#16302A;--red:#F07167;--redbg:#3A1C1C;--org:#F5B454;--orgbg:#3A2A12;--blu:#7EB2EE;--blubg:#16263A;--sh:0 4px 16px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;font-size:15px;line-height:1.55}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:760px;margin:0 auto;padding:12px 14px 20px}
h1,h2,h3{margin:0;line-height:1.3}
h1{font-size:21px;font-weight:800}h2{font-size:17px;font-weight:800}h3{font-size:15px;font-weight:700}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.top .t{flex:1;min-width:0}.top .t small{display:block;color:var(--mute);font-size:12.5px;font-weight:500}
.ibtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.stack>*+*{margin-top:10px}
.row{display:flex;align-items:center;gap:10px}.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sub{color:var(--mute);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:13px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.btn,a.btn{text-decoration:none}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}.btn.hi{background:var(--hi);border-color:var(--hi);color:#fff}.btn.grn{background:var(--grn);border-color:var(--grn);color:#fff}.btn.red{color:var(--red);border-color:var(--red)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}.btn.w{width:100%}
.btn:disabled{opacity:.5}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;cursor:pointer}
.stat b{display:block;font-size:24px;font-weight:800;color:var(--ac);line-height:1.2}.stat span{font-size:12px;color:var(--mute)}
.stat.hi b{color:var(--hi)}.stat.grn b{color:var(--grn)}.stat.red b{color:var(--red)}
.list .item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}.list .item:last-child{border-bottom:0}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;background:var(--ac2);color:var(--ac)}
.av.w{background:var(--hibg);color:var(--hi)}
.item .x{flex:1;min-width:0}.item .x b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--soft);color:var(--mute);white-space:nowrap}
.tag.grn{background:var(--grnbg);color:var(--grn)}.tag.red{background:var(--redbg);color:var(--red)}.tag.org{background:var(--orgbg);color:var(--org)}.tag.blu{background:var(--blubg);color:var(--blu)}.tag.hi{background:var(--hibg);color:var(--hi)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}.kv:last-child{border-bottom:0}.kv span{color:var(--mute)}
.f{display:block;margin-top:10px;font-size:13px;font-weight:700;color:var(--mute)}
.f input,.f select,.f textarea,input.in,select.in{display:block;width:100%;margin-top:5px;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:500;color:var(--ink)}
.f textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:0;border-color:transparent}
.sec{margin-top:18px}.sec>h2{margin-bottom:8px;display:flex;align-items:center;gap:8px}.sec>h2::before{content:"";width:4px;height:18px;border-radius:3px;background:var(--hi)}
.alert{padding:12px 14px;border-radius:12px;background:var(--orgbg);color:var(--org);font-weight:600;font-size:14px}.alert.red{background:var(--redbg);color:var(--red)}.alert.grn{background:var(--grnbg);color:var(--grn)}.alert.blu{background:var(--blubg);color:var(--blu)}
.money{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;max-width:120px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--mute);padding:6px 0;cursor:pointer;border-radius:12px}
.nav button.on{color:var(--ac);background:var(--ac2)}
.nav .scan{background:var(--hi);color:#fff;border-radius:16px;margin:-18px 4px 0;box-shadow:0 6px 18px rgba(255,107,44,.4);max-width:74px}
.nav .scan.on{background:var(--hi);color:#fff}
.sheetbg{position:fixed;inset:0;background:rgba(10,14,25,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:-6px auto 10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:70;background:#141B2D;color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;max-width:90vw;display:none;text-align:center}
#busy{position:fixed;top:0;left:0;right:0;height:3px;z-index:80;display:none;background:linear-gradient(90deg,var(--hi),var(--ac));animation:bz 1s linear infinite;background-size:200% 100%}
@keyframes bz{to{background-position:-200% 0}}
.scanbox{position:relative;border-radius:20px;overflow:hidden;background:#000;aspect-ratio:1/1;max-height:62vh;margin:0 auto}
.scanbox video{width:100%;height:100%;object-fit:cover}
.scanbox .frame{position:absolute;inset:16%;border:3px solid rgba(255,255,255,.85);border-radius:20px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.res{border-radius:20px;padding:18px;text-align:center;margin-top:12px}
.res.ok{background:var(--grnbg);color:var(--grn)}.res.no{background:var(--redbg);color:var(--red)}
.res b{display:block;font-size:22px;font-weight:800;color:var(--ink);margin:4px 0}
.res .big{font-size:40px;line-height:1}
.gate{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:#fff}
.gate.ok{background:#0E7A55}.gate.no{background:#B3261E}
.gate .nm{font-size:34px;font-weight:800;margin:10px 0}.gate .ms{font-size:20px;opacity:.95}
.bar{height:8px;border-radius:8px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:8px}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--mute)}
.bars i{display:block;width:100%;background:var(--ac);border-radius:5px 5px 0 0;min-height:2px}
.bars i.hi{background:var(--hi)}
.qr{background:#fff;padding:14px;border-radius:18px;display:inline-block}.qr svg,.qr img{display:block;width:220px;height:220px}
.cart{position:sticky;bottom:84px;z-index:5}
.prod{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:10px;text-align:center;cursor:pointer}
.prod b{display:block;font-size:13.5px}.prod.out{opacity:.45}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}.tbl td,.tbl th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}.tbl th{color:var(--mute);font-weight:700;font-size:12px}.tbl td.n{text-align:left;direction:ltr;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--mute);padding:22px 10px;font-size:14px}
.hero{background:linear-gradient(135deg,#1D3D8F,#2B57C2);color:#fff;border-radius:20px;padding:16px;box-shadow:var(--sh)}
.hero .sub{color:rgba(255,255,255,.8)}
.login{max-width:380px;margin:9vh auto 0;text-align:center}
.login .logo{width:76px;height:76px;border-radius:22px;background:linear-gradient(135deg,var(--hi),#E2452B);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;color:#fff}
.pin{letter-spacing:10px;text-align:center;font-size:24px!important;font-weight:800!important}
details.help{margin-top:8px}details.help summary{cursor:pointer;color:var(--ac);font-weight:700;font-size:13.5px}
.note{font-size:12.5px;color:var(--mute);margin-top:6px;line-height:1.7}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.sw input{width:22px;height:22px}
@media (min-width:640px){.grid4m{grid-template-columns:repeat(4,1fr)!important}}
</style>
</head>

function subCalc(){var p=planBy(NS.plan);if(!p||!$('sbNet'))return;var price=$('sbP')?Number($('sbP').value)||0:p.price,disc=Number($('sbD').value)||0,net=Math.max(0,price-disc);setH($('sbNet'),money(net));
 var pd=$('sbPd').value===''?net:Number($('sbPd').value)||0;if($('sbPd').value==='')$('sbPd').placeholder=net;var need=pd<net-0.01;$('sbInst').style.display=need?'block':'none';
 if(need){var n=Number($('sbN').value)||1,e=Number($('sbE').value)||30,rest=net-pd,part=Math.floor(rest/n),L=[];for(var i=1;i<=n;i++)L.push(addD(D.today,e*i)+': '+(i===n?rest-part*(n-1):part));setH($('sbSch'),'الأقساط: '+L.map(esc).join(' · '))}}
function doSubscribe(){var p=planBy(NS.plan),o={member:NS.m,plan:NS.plan,renew:NS.renew,renewOf:NS.of,start:$('sbS').value,discount:$('sbD').value,method:$('sbM').value,notes:$('sbNo').value,branch:curBr()};
 if($('sbP'))o.price=$('sbP').value;if($('sbT'))o.staff=$('sbT').value;var net=Math.max(0,(o.price!=null?Number(o.price):p.price)-(Number(o.discount)||0));o.paid=$('sbPd').value===''?net:$('sbPd').value;
 if(Number(o.paid)<net-0.01){o.installments=$('sbN').value;o.every=$('sbE').value}
 run('appSubscribe',[o],function(){var mid=NS.m;NS=null;if(MD[mid])MD[mid]._stale=1;toast('الاشتراك اتسجل ✓');V={s:'member',p:{id:mid}};draw();if(V.p&&memBy(mid)&&!memBy(mid).welcomed){}})}

 h+='<div class="card">'+f('name','اسم الجيم')+f('phone','تليفون الجيم','type="tel"')+'<div class="grid2">'+f('maxDisc','أقصى خصم للاستقبال %','type="number"')+f('graceDays','أيام سماح بعد نهاية الاشتراك','type="number"')+f('bookAhead','حجز الكلاسات قبلها بكام يوم','type="number"')+f('depMonths','عمر الأجهزة للإهلاك (شهور)','type="number"')+'</div>'+f('openingCash','الرصيد النقدي الافتتاحي','type="number"')+'<label class="sw"><span>منع الدخول لو عليه قسط متأخر</span><input id="st_blockOverdue" type="checkbox" '+(s.blockOverdue?'checked':'')+'></label>'+f('appUrl','رابط التطبيق (للكارت)','dir="ltr" placeholder="'+esc(location.origin+location.pathname)+'"')+'</div>';
 h+='<div class="sec"><h2>رسايل واتساب</h2><div class="card">'+[['tplWelcome','الترحيب وإرسال الكارت'],['tplExpiring','قرب انتهاء الاشتراك'],['tplExpired','بعد انتهاء الاشتراك'],['tplInstallment','تذكير القسط'],['tplClass','تأكيد حجز الكلاس']].map(function(x){return '<label class="f">'+x[1]+'<textarea id="st_'+x[0]+'">'+esc(s[x[0]])+'</textarea></label>'}).join('')+'<p class="note">الكلمات اللي بين {} بتتبدل لوحدها: {الاسم} {الجيم} {الكارت} {الباقة} {النهاية} {المبلغ} {العملة} {التاريخ} {الكلاس} {الساعة}</p></div></div>';
 h+='<button class="btn pri w" style="margin-top:14px" onclick="saveSet()">حفظ الإعدادات</button>';
 h+='<details class="help" style="margin-top:14px"><summary>رابط السيستم (للمطور)</summary><input class="in" dir="ltr" readonly value="'+esc(API)+'"><button class="btn sm red" style="margin-top:8px" onclick="if(confirm(\'تغيير الرابط؟\')){lsSet(\'gymApi\',null);API=GYM_API;logoutLocal()}">رجّع الرابط الافتراضي</button></details>';
 return h}
function saveSet(){var o={};['name','phone','maxDisc','graceDays','bookAhead','depMonths','openingCash','appUrl','tplWelcome','tplExpiring','tplExpired','tplInstallment','tplClass'].forEach(function(k){var e=$('st_'+k);if(e)o[k]=e.value});o.blockOverdue=$('st_blockOverdue').checked;run('appSaveSettings',[o],function(){toast('اتحفظ ✓')})}
function vBranches(){var h=hdr('الفروع والمواعيد','',"go('more')",'<button class="btn sm pri" onclick="askBranch()">'+ic('plus',16)+' فرع</button>');
 h+=D.branches.map(function(b){return '<div class="card" style="margin-top:8px" onclick="askBranch('+jsa(b.id)+')"><div class="between"><b>'+esc(b.name)+'</b><span class="tag '+(b.active?'grn':'')+'">'+(b.active?'شغال':'موقوف')+'</span></div><div class="kv"><span>رجال</span><b>'+(b.menFrom?t12(b.menFrom)+' ← '+t12(b.menTo):'مفيش')+'</b></div><div class="kv"><span>ستات</span><b>'+(b.womenFrom?t12(b.womenFrom)+' ← '+t12(b.womenTo):'مفيش')+'</b></div>'+(b.days?'<div class="kv"><span>إجازة</span><b>'+esc(b.days)+'</b></div>':'')+'</div>'}).join('');
 return h+'<p class="note">لو الفرع فيه صالة واحدة بمواعيد للستات، اكتب مواعيد الستات (مثلاً 10 الصبح لـ 2 الضهر) ومواعيد الرجال باقي اليوم. لو فيه صالتين منفصلتين، اكتب نفس المواعيد للقسمين.</p>'}
function askBranch(id){var b=id?brBy(id):{active:true,menFrom:'06:00',menTo:'23:00',womenFrom:'10:00',womenTo:'16:00'};var ds=String(b.days||'');
 openSheet('<h2>'+(id?'تعديل فرع':'فرع جديد')+'</h2><label class="f">الاسم<input id="bN" value="'+esc(b.name||'')+'"></label><label class="f">العنوان<input id="bA" value="'+esc(b.address||'')+'"></label><label class="f">التليفون<input id="bP" type="tel" value="'+esc(b.phone||'')+'"></label><h3 style="margin-top:12px">قسم الرجال</h3><div class="grid2"><label class="f">من<input id="bMF" type="time" value="'+esc(b.menFrom)+'"></label><label class="f">لحد<input id="bMT" type="time" value="'+esc(b.menTo)+'"></label></div><h3 style="margin-top:12px">قسم الستات</h3><div class="grid2"><label class="f">من<input id="bWF" type="time" value="'+esc(b.womenFrom)+'"></label><label class="f">لحد<input id="bWT" type="time" value="'+esc(b.womenTo)+'"></label></div><p class="note">سيب المواعيد فاضية لو الفرع مافيهوش القسم ده.</p><div class="f">أيام الإجازة</div><div class="chips" style="flex-wrap:wrap">'+['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'].map(function(x){return '<button class="chip bday'+(ds.indexOf(x)>=0?' on':'')+'" onclick="this.classList.toggle(\'on\')">'+x+'</button>'}).join('')+'</div><label class="sw"><span>شغال</span><input id="bOn" type="checkbox" '+(b.active?'checked':'')+'></label><button class="btn pri w" style="margin-top:14px" onclick="run(\'appSaveBranch\',[{id:'+jsa(id||'')+',name:$(\'bN\').value,address:$(\'bA\').value,phone:$(\'bP\').value,menFrom:$(\'bMF\').value,menTo:$(\'bMT\').value,womenFrom:$(\'bWF\').value,womenTo:$(\'bWT\').value,days:[].map.call(document.querySelectorAll(\'.bday.on\'),function(e){return e.textContent}).join(\'،\'),active:$(\'bOn\').checked}],function(){closeSheet();toast(\'اتحفظ ✓\');draw()})">حفظ</button>')}
function vUsers(){var h=hdr('الموظفين والصلاحيات','',"go('more')",'<button class="btn sm pri" onclick="askUser()">'+ic('plus',16)+' موظف</button>');
 h+='<div class="card list">'+D.users.map(function(u){return '<div class="item" onclick="askUser('+jsa(u.id)+')"><div class="av">'+initials(u.name)+'</div><div class="x"><b>'+esc(u.name)+'</b><span class="sub">'+esc(u.role)+(u.branch?' · '+esc(brName(u.branch)):'')+(u.section?' · '+esc(u.section):'')+(u.comm?' · عمولة '+u.comm+'%':'')+'</span></div><span class="tag '+(u.active?'grn':'')+'">'+(u.active?'نشط':'موقوف')+'</span></div>'}).join('')+'</div>';
 h+='<div class="sec"><h2>مين يقدر يعمل إيه</h2><div class="card"><table class="tbl"><tr><th></th><th>المدير</th><th>مدير فرع</th><th>استقبال</th><th>مدرب</th></tr>'+[['الأعضاء والاشتراكات والدخول','✓','فرعه','فرعه/قسمه','—'],['خصم','أي خصم','أي خصم','لحد '+D.settings.maxDisc+'%','—'],['تجميد','✓','✓ وفوق المسموح','في حدود الباقة','—'],['إلغاء ورد فلوس','✓','✓','—','—'],['الكاشير','✓','✓','✓','—'],['المخزن والمصروفات','✓','فرعه','—','—'],['الحسابات','كل الفروع','فرعه','—','عمولته'],['الكلاسات','✓','✓','حجز','حضور كلاساته'],['البرامج والقياسات','✓','✓','عرض','✓'],['الباقات والموظفين والفروع','✓','—','—','—']].map(function(r){return '<tr>'+r.map(function(c,i){return i?'<td style="text-align:center">'+c+'</td>':'<td>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</table><p class="note">أخصائي العلاج الطبيعي زي المدرب، بس بيشوف مرضاه بس، وملاحظات العلاج مش بتظهر للاستقبال.</p></div></div>';
 return h}
function askUser(id){var u=id?userBy(id):{role:'استقبال',active:true,branch:BR};var pm=String(u.perms||'');
 openSheet('<h2>'+(id?'تعديل موظف':'موظف جديد')+'</h2><label class="f">الاسم<input id="uN" value="'+esc(u.name||'')+'"></label><div class="grid2"><label class="f">الصلاحية<select id="uR">'+D.roles.map(function(r){return '<option'+(u.role===r?' selected':'')+'>'+r+'</option>'}).join('')+'</select></label><label class="f">الرقم السري (6 أرقام)<input id="uP" inputmode="numeric" maxlength="6" value="'+esc(u.pin||'')+'"></label><label class="f">الفرع<select id="uB"><option value="">كل الفروع</option>'+D.branches.map(function(b){return '<option value="'+esc(b.id)+'"'+(u.branch===b.id?' selected':'')+'>'+esc(b.name)+'</option>'}).join('')+'</select></label><label class="f">القسم<select id="uS"><option value="">الاتنين</option><option'+(u.section==='رجال'?' selected':'')+'>رجال</option><option'+(u.section==='ستات'?' selected':'')+'>ستات</option></select></label><label class="f">التليفون<input id="uT" type="tel" value="'+esc(u.phone||'')+'"></label><label class="f">عمولة الجلسة %<input id="uC" type="number" value="'+(u.comm||0)+'"></label></div><label class="f">المرتب الشهري<input id="uM" type="number" value="'+(u.salary||'')+'"></label><div class="f">صلاحيات إضافية</div>'+Object.keys(D.perms).map(function(k){return '<label class="sw"><span>'+esc(D.perms[k])+'</span><input type="checkbox" class="uperm" value="'+k+'" '+(pm.indexOf(k)>=0?'checked':'')+'></label>'}).join('')+'<label class="sw"><span>نشط</span><input id="uA" type="checkbox" '+(u.active?'checked':'')+'></label><button class="btn pri w" style="margin-top:14px" onclick="run(\'appSaveUser\',[{id:'+jsa(id||'')+',name:$(\'uN\').value,role:$(\'uR\').value,pin:$(\'uP\').value,branch:$(\'uB\').value,section:$(\'uS\').value,phone:$(\'uT\').value,comm:$(\'uC\').value,salary:$(\'uM\').value,perms:[].map.call(document.querySelectorAll(\'.uperm:checked\'),function(e){return e.value}),active:$(\'uA\').checked}],function(){closeSheet();toast(\'اتحفظ ✓\');draw()})">حفظ</button>')}
function vPlans(){var h=hdr('الباقات والأسعار','',"go('more')",'<button class="btn sm pri" onclick="askPlan()">'+ic('plus',16)+' باقة</button>');
 D.kinds.forEach(function(k){var L=D.plans.filter(function(p){return p.kind===k});if(!L.length)return;h+='<div class="sec"><h2>'+esc(k)+'</h2><div class="card list">'+L.map(function(p){return '<div class="item" onclick="askPlan('+jsa(p.id)+')"><div class="x"><b>'+esc(p.name)+'</b><span class="sub">'+(p.type==='حصص'?p.sessions+' حصة · ':'')+p.days+' يوم · تجميد '+p.freeze+' يوم'+(p.section!=='الكل'?' · '+esc(p.section):'')+(p.allBranches?' · كل الفروع':'')+(p.classes&&p.kind==='جيم'?' · + كلاسات':'')+'</span></div><b>'+money(p.price)+'</b>'+(p.active?'':'<span class="tag">موقوفة</span>')+'</div>'}).join('')+'</div></div>'});return h}
function askPlan(id){var p=id?planBy(id):{kind:'جيم',type:'مدة',days:30,section:'الكل',freeze:7,active:true};
 openSheet('<h2>'+(id?'تعديل باقة':'باقة جديدة')+'</h2><label class="f">الاسم<input id="plN" value="'+esc(p.name||'')+'"></label><div class="grid2"><label class="f">النوع<select id="plK">'+D.kinds.map(function(k){return '<option'+(p.kind===k?' selected':'')+'>'+k+'</option>'}).join('')+'</select></label><label class="f">الحساب<select id="plT"><option'+(p.type==='مدة'?' selected':'')+'>مدة</option><option'+(p.type==='حصص'?' selected':'')+'>حصص</option></select></label><label class="f">المدة بالأيام<input id="plD" type="number" value="'+p.days+'"></label><label class="f">عدد الحصص<input id="plS" type="number" value="'+(p.sessions||'')+'"></label><label class="f">السعر<input id="plP" type="number" value="'+(p.price||'')+'"></label><label class="f">أيام التجميد المسموحة<input id="plF" type="number" value="'+p.freeze+'"></label><label class="f">القسم<select id="plC">'+['الكل','رجال','ستات'].map(function(x){return '<option'+(p.section===x?' selected':'')+'>'+x+'</option>'}).join('')+'</select></label></div><label class="sw"><span>يدخل كل الفروع</span><input id="plA" type="checkbox" '+(p.allBranches?'checked':'')+'></label><label class="sw"><span>يشمل الكلاسات</span><input id="plL" type="checkbox" '+(p.classes?'checked':'')+'></label><label class="sw"><span>متاحة</span><input id="plO" type="checkbox" '+(p.active?'checked':'')+'></label><p class="note">«حصص»: الاشتراك بيخلص لما الحصص تخلص أو المدة تخلص، أيهما أقرب. البرايفت والعلاج الطبيعي دايماً بالحصص.</p><button class="btn pri w" style="margin-top:14px" onclick="run(\'appSavePlan\',[{id:'+jsa(id||'')+',name:$(\'plN\').value,kind:$(\'plK\').value,type:$(\'plT\').value,days:$(\'plD\').value,sessions:$(\'plS\').value,price:$(\'plP\').value,freeze:$(\'plF\').value,section:$(\'plC\').value,allBranches:$(\'plA\').checked,classes:$(\'plL\').checked,active:$(\'plO\').checked}],function(){closeSheet();toast(\'اتحفظ ✓\');draw()})">حفظ</button>')}
/* ---------- كارت العضو (من غير دخول) ---------- */
var CD=null;
function drawCard(tok){var app=$('app');if(!CD){setH(app,'<div class="empty">جاري التحميل...</div>');run('appCard',[tok],function(r){CD=r;drawCard(tok)});return}
 var c=CD,m=c.member,g=c.subs.filter(function(s){return s.status==='ساري'||s.status==='مجمد'||s.status==='لسه مابدأش'});
 var h='<div style="text-align:center;margin-top:6px"><div class="sub">'+esc(c.gym)+'</div><h1 style="margin:4px 0">'+esc(m.name)+'</h1><div class="sub">'+esc(m.id)+' · '+esc(m.gender)+' · '+esc(c.branch.name||'')+'</div><div class="qr" style="margin-top:12px">'+qrSvg(m.token,240)+'</div><p class="note">وَرّي الكود ده على الباب أو للاستقبال</p></div>';
 h+=g.length?g.map(function(s){return '<div class="card" style="margin-top:10px"><div class="between"><b>'+esc(s.planName)+'</b><span class="tag '+(s.status==='ساري'?'grn':'blu')+'">'+esc(s.status)+'</span></div>'+(s.sessions?'<div class="kv"><span>الحصص الباقية</span><b>'+s.left+' من '+s.sessions+'</b></div>':'')+'<div class="kv"><span>لحد</span><b>'+d2(s.end)+' (باقي '+s.daysLeft+' يوم)</b></div>'+(s.frozenNow?'<div class="alert blu">متجمد لحد '+d2(s.frozenNow.to)+'</div>':'')+(s.overdue?'<div class="alert red">عليك قسط '+s.overdue+' — كلّم الاستقبال</div>':s.nextDue?'<div class="kv"><span>القسط الجاي</span><b>'+s.nextDue.amount+' يوم '+d2(s.nextDue.due)+'</b></div>':'')+'</div>'}).join(''):'<div class="alert" style="margin-top:10px">مفيش اشتراك ساري. كلّم الاستقبال علشان تجدد'+(c.phone?' ('+esc(c.phone)+')':'')+'</div>';
 h+='<div class="grid2" style="margin-top:10px"><div class="stat"><b>'+c.visits+'</b><span>مرة جيت الشهر ده</span></div><div class="stat"><b style="font-size:15px">'+(m.gender==='ستات'?(c.branch.womenFrom?t12(c.branch.womenFrom)+' ← '+t12(c.branch.womenTo):'—'):(c.branch.menFrom?t12(c.branch.menFrom)+' ← '+t12(c.branch.menTo):'—'))+'</b><span>مواعيد قسمك</span></div></div>';
 var canBook=c.subs.some(function(s){return s.status==='ساري'&&s.classes});
 if(c.classes.length)h+='<div class="sec"><h2>الكلاسات</h2>'+(canBook?'':'<p class="note">الحجز من هنا لأصحاب اشتراك الكلاسات. للحصة المنفردة احجز من الاستقبال.</p>')+'<div class="card list">'+c.classes.map(function(k){return '<div class="item" style="cursor:default"><div class="x"><b>'+esc(k.name)+'</b><span class="sub">'+esc(k.day)+' '+d2(k.date)+' · '+t12(k.time)+(k.coach?' · '+esc(k.coach):'')+' · فاضل '+k.left+'</span></div>'+(k.mine?'<button class="btn sm red" onclick="run(\'appCardCancel\',['+jsa(m.token)+','+jsa(k.mine)+'],function(r){CD=r;drawCard('+jsa(m.token)+')})">إلغاء</button>':canBook&&k.left>0?'<button class="btn sm pri" onclick="run(\'appCardBook\',['+jsa(m.token)+','+jsa(k.id)+','+jsa(k.date)+'],function(r){CD=r;toast(\'اتحجز ✓\');drawCard('+jsa(m.token)+')})">احجز</button>':'')+'</div>'}).join('')+'</div></div>';
 if(c.prog.length)h+='<div class="sec"><h2>برنامجك</h2>'+c.prog.map(function(p){return '<details class="card" style="margin-top:8px"'+(p===c.prog[0]?' open':'')+'><summary style="font-weight:800;cursor:pointer">'+esc(p.type)+' · '+d2(p.date)+'</summary>'+(p.weight?'<div class="row" style="flex-wrap:wrap;margin-top:6px"><span class="tag blu">وزن '+p.weight+'</span>'+(p.fat?'<span class="tag blu">دهون '+p.fat+'%</span>':'')+(p.muscle?'<span class="tag blu">عضل '+p.muscle+'</span>':'')+'</div>':'')+(p.text?'<div style="white-space:pre-wrap;margin-top:6px">'+esc(p.text)+'</div>':'')+'</details>'}).join('')+'</div>';
 h+='<p class="note" style="text-align:center;margin-top:18px">احفظ الصفحة دي على الشاشة الرئيسية علشان تفتحها بسرعة</p>';
 setH(app,h)}
