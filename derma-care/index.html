/* ============================================================
   Moon Wedding dress — تصميم محسّن (ألوان + خطوط + تنسيق)
   الخطوط: Amiri للعناوين · Tajawal للنصوص والواجهة
   ============================================================ */
:root{
  /* لوحة ألوان عاجي + ذهبي أنيق بلمسة روز */
  --ac:#0E6E6E;          /* ذهبي غامق (اللون الرئيسي) */
  --gold:#2BA59A;
  --gold2:#A9DCD5;
  --ac2:#F7EFDC;
  --bg:#FBF8F2;
  --line:#EBE0C9;
  --line2:#F4EEE1;
  --ink:#2B2318;
  --mute:#7C7060;
  --ink2:#473B29;
  --red:#93403A;   --redbg:#F8E7E3;
  --amb:#7D5413;   --ambbg:#FBF0DB;
  --grn:#1F5C34;   --grnbg:#E2F1E7;
  --blu:#1D4C80;   --blubg:#DFEAF8;
  --org:#8A4A12;   --orgbg:#FCE8D6;
  --gry:#4A5456;   --grybg:#EEECE8;
  /* ظلال وانتقالات */
  --sh:0 1px 2px rgba(74,58,24,.05),0 4px 14px rgba(74,58,24,.06);
  --sh2:0 6px 22px rgba(74,58,24,.13);
  --tr:.18s ease;
  --surface:#fff;--field:#FFFEFB;--soft:#FFF8E6;--soft2:#F7F0E1;--hover:#FBF7EE;--segbg:#F1E7D1;--fline:#E2D6BC;
  --navbg:rgba(255,255,255,.9);--busybg:rgba(251,248,242,.8);--glow:#F6EDDA;--toastbg:#2B2318;--toastfg:#fff;color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal','IBM Plex Sans Arabic',Tahoma,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(1200px 500px at 50% -10%,var(--glow) 0%,var(--bg) 55%) fixed}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:600px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 120px}
h1{margin:0;font-size:23px;font-weight:800;letter-spacing:.1px}
h2{margin:0;font-size:17px;font-weight:700}
.sub{font-size:13px;color:var(--mute)}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.stack{display:flex;flex-direction:column;gap:10px}
.sec{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh)}
button.card{width:100%;text-align:right;cursor:pointer;transition:transform var(--tr),box-shadow var(--tr),border-color var(--tr)}

.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.stat{border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);background:var(--surface);text-align:right;cursor:pointer;box-shadow:var(--sh);transition:transform var(--tr),box-shadow var(--tr)}
.stat:active{transform:scale(.98)}
.stat b{font-size:24px;font-weight:800}.stat span{font-size:13px;color:var(--mute)}
.stat.pri{background:linear-gradient(135deg,#2BA59A 0%,#0E6E6E 100%);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(14,110,110,.28)}

nav.bar{position:fixed;bottom:0;left:0;right:0;background:var(--navbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,minmax(0,1fr));z-index:10;box-shadow:0 -4px 18px rgba(74,58,24,.07)}

.sheet{position:fixed;inset:0;background:rgba(43,35,24,.45);backdrop-filter:blur(2px);z-index:25;display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--surface);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:600px;max-height:88vh;overflow:auto;box-shadow:0 -10px 40px rgba(43,35,24,.2)}
.pick{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:14px}

.brand{display:flex;align-items:center;gap:10px}.brand .logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#5CCABD 0%,#0E6E6E 100%);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 3px 10px rgba(14,110,110,.3)}
h1.gold{background:linear-gradient(90deg,#0E6E6E,#2BA59A 55%,#0E6E6E);-webkit-background-clip:text;background-clip:text;color:transparent;font-family:'Amiri',Georgia,'Times New Roman',serif;letter-spacing:.3px}
.qty{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.av{position:relative;overflow:hidden}.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--ac2)}

.seg.s4{grid-template-columns:repeat(4,minmax(0,1fr))}.seg.s4 button{font-size:13px;padding:0 2px}

.up{color:var(--grn)}.dn{color:var(--red)}

.lgd{display:flex;gap:14px;justify-content:center;font-size:12.5px;color:var(--mute);margin-top:6px}.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px;vertical-align:-1px}
.hb{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13.5px}.hb .l{width:38%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb .t{flex:1;height:12px;background:var(--line2);border-radius:6px;overflow:hidden}.hb .t div{height:100%;background:linear-gradient(90deg,#2BA59A,#0E6E6E);border-radius:6px}.hb .v{min-width:74px;text-align:left;font-weight:700;font-variant-numeric:tabular-nums}

.rec{background:var(--surface);border:1px solid var(--line);border-right:4px solid var(--gold);border-radius:14px;padding:10px 12px;box-shadow:var(--sh)}.rec.p1{border-right-color:#B4473C}.rec.p3{border-right-color:#2E7D4F}

.rate{display:flex;gap:4px}.rate button{width:44px;height:44px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:22px;color:#BFDCD7;cursor:pointer;transition:all var(--tr)}.rate button.on{color:#2BA59A;border-color:var(--gold2);background:var(--soft)}

.guide{--acc:var(--ac);--accbg:var(--ac2);--surface:#fff;--gold2:#2BA59A;--staffbg:#DDEEF2;display:flex;flex-direction:column;gap:18px;margin-top:14px}

.guide .hub b{font-size:18px}.guide .hub span{font-size:12.5px;opacity:.9}

<script>
/* ============================ المحرك المالي ============================
 * نفس الكود ده شغال في السيستم (التقرير الشهري والإيميل) وفي التطبيق (لوحة المؤشرات والتقرير).
 * بياخد البيانات (حجوزات، مدفوعات، مصروفات، فساتين، عملاء، مخزن) ويطلع:
 * قائمة الدخل، التدفقات النقدية، المركز المالي، المؤشرات، والتوصيات.
 */
var FIN_SUPP = 'مشتريات من موردين', FIN_COMM = 'عمولات الموظفين', FIN_DRESS_BUY = '__none__', FIN_CANCEL = 'ملغي', FIN_BOOKED = 'محجوز', FIN_OUT = 'حضر';
function finMo_(s) { return s ? String(s).slice(0, 7) : ''; }
function finAddM_(m, n) { var p = m.split('-'), d = new Date(+p[0], +p[1] - 1 + n, 1); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2); }
function finDiffM_(a, b) { var x = a.split('-'), y = b.split('-'); return (+y[0] - +x[0]) * 12 + (+y[1] - +x[1]); }
function finDaysIn_(m) { var p = m.split('-'); return new Date(+p[0], +p[1], 0).getDate(); }
function finDate_(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function finAddD_(s, n) { var d = finDate_(s); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function finR_(x) { return Math.round((Number(x) || 0) * 100) / 100; }
function finPct_(a, b) { return b ? a / b : 0; }
var FIN_MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
function finMonthName_(m) { var p = m.split('-'); return FIN_MONTHS[+p[1] - 1] + ' ' + p[0]; }

// تجهيز البيانات مرة واحدة (فهارس) علشان الحسابات تبقى سريعة
function finPrep_(D, opt) {
  opt = opt || {};
  var P = { D: D, dep: Math.max(1, Math.round(Number(opt.depMonths) || 24)), open: Number(opt.openingCash) || 0, today: D.today, tm: finMo_(D.today) };
  var payBy = {};
  (D.payments || []).forEach(function (p) { (payBy[p.bk] = payBy[p.bk] || []).push(p); });
  P.payBy = payBy;
  var start = P.tm;
  function seen(s) { var m = finMo_(s); if (m && m < start) start = m; }
  (D.payments || []).forEach(function (p) { seen(p.date); });
  (D.expenses || []).forEach(function (e) { seen(e.date); });
  (D.bookings || []).forEach(function (b) { seen(b.created); seen(b.pickup); });
  (D.assets || []).forEach(function (a) { seen(a.date); });
  (D.ledger || []).forEach(function (l) { seen(l.date); });
  P.start = start;
  // الأصول اللي بتتهلك: الفساتين (من تاريخ الشراء) + التجهيزات (من تاريخ المصروف)
  P.assets = [];
  (D.dresses || []).forEach(function (d) { if (d.cost > 0) P.assets.push({ kind: 'dress', cost: d.cost, start: finMo_(d.bought) || start }); });
  (D.expenses || []).forEach(function (e) { if (e.ctype === 'رأسمالي' && e.cat !== FIN_DRESS_BUY && e.amount > 0) P.assets.push({ kind: 'equip', cost: e.amount, start: finMo_(e.date) }); });
  (D.assets || []).forEach(function (a) { if (a.cost > 0) P.assets.push({ kind: 'equip', cost: a.cost, start: finMo_(a.date) || start, dep: a.life }); });
  return P;
}
function finDepIn_(P, m, kind) { // إهلاك الشهر
  var s = 0;
  P.assets.forEach(function (a) { if (kind && a.kind !== kind) return; var L = a.dep || P.dep, k = finDiffM_(a.start, m); if (k >= 0 && k < L) s += a.cost / L; });
  return s;
}
function finNbv_(P, m, kind) { // صافي القيمة الدفترية آخر الشهر
  var s = 0;
  P.assets.forEach(function (a) { if (a.kind !== kind) return; var L = a.dep || P.dep, k = finDiffM_(a.start, m); if (k < 0) return; s += a.cost - Math.min(L, k + 1) * a.cost / L; });
  return s;
}

// قائمة الدخل لشهر
function finIncome_(P, m) {
  var D = P.D, I = { rev: 0, gross: 0, disc: 0, kept: 0, comm: 0, fixed: 0, variable: 0, capex: 0, commPaid: 0, count: 0, cancels: 0, all: 0, byCat: {}, byType: {}, byStaff: {} };
  var typeOf = {}; (D.dresses || []).forEach(function (d) { typeOf[d.code] = d.type || 'أخرى'; });
  (D.bookings || []).forEach(function (b) {
    if (finMo_(b.pickup) !== m) return;
    I.all++;
    if (finVoid_(b)) { I.cancels++; if (b.paid > 0) I.kept += b.paid; return; }
    I.count++; I.rev += b.net; I.gross += b.price; I.disc += b.discount || 0;
    var t = typeOf[b.dress] || 'أخرى'; I.byType[t] = (I.byType[t] || 0) + b.net;
    if (b.staff) { var s = I.byStaff[b.staff] = I.byStaff[b.staff] || { n: 0, v: 0, c: 0 }; s.n++; s.v += b.net; }
  });
  // العمولة بتتحسب في شهر الحجز نفسه
  (D.bookings || []).forEach(function (b) {
    if (finMo_(b.created) !== m || !b.commission) return;
    I.comm += b.commission;
    if (b.staff) { var s = I.byStaff[b.staff] = I.byStaff[b.staff] || { n: 0, v: 0, c: 0 }; s.c += b.commission; }
  });
  (D.ledger || []).forEach(function (l) {
    if (finMo_(l.date) !== m || l.ptype !== 'مورد' || l.move !== 'فاتورة') return;
    I.variable += l.amount; I.byCat[FIN_SUPP] = (I.byCat[FIN_SUPP] || 0) + l.amount;
  });
  (D.expenses || []).forEach(function (e) {
    if (finMo_(e.date) !== m) return;
    if (e.cat === FIN_COMM) { I.commPaid += e.amount; return; }
    if (e.ctype === 'رأسمالي') { I.capex += e.amount; return; }
    if (e.ctype === 'ثابت') I.fixed += e.amount; else I.variable += e.amount;
    I.byCat[e.cat] = (I.byCat[e.cat] || 0) + e.amount;
  });
  I.depDress = finDepIn_(P, m, 'dress'); I.depEquip = finDepIn_(P, m, 'equip'); I.dep = I.depDress + I.depEquip;
  I.totalRev = I.rev + I.kept;
  I.contrib = I.totalRev - I.variable - I.comm;          // هامش المساهمة
  I.op = I.contrib - I.fixed - I.dep;                     // صافي الربح
  I.margin = finPct_(I.op, I.totalRev);
  I.avg = finPct_(I.rev, I.count);
  I.discRate = finPct_(I.disc, I.gross);
  I.cancelRate = finPct_(I.cancels, I.all);
  var cr = finPct_(I.contrib, I.totalRev);

function finVoid_(b) { return b.status === 'ملغي' || b.status === 'لم يحضر'; }

var GUIDE={"owner": "<section class=\"cycle\" aria-label=\"دورة الحجز\">\n    <h2>دورة أي حجز من أوله لآخره<\/h2>\n    <ol class=\"steps\">\n      <li><b>الحجز<\/b>فستان + مواعيد + عميلة. السيستم بيمنع أي تعارض لوحده.<\/li>\n      <li><b>العربون<\/b>بيتسجل مع الحجز باسم اللي استلمه.<\/li>\n      <li><b>التذكير<\/b>رسالة واتساب جاهزة قبل الميعاد.<\/li>\n      <li><b>يوم الاستلام<\/b>دوس «اتسلم للعميلة»، والباقي بيتحصّل تلقائياً.<\/li>\n      <li><b>الإرجاع<\/b>«الفستان رجع»: محتاج تنظيف أو جاهز.<\/li>\n      <li><b>التنظيف<\/b>الفستان يروح الدراي كلين، ولما يرجع تخليه «جاهز».<\/li>\n    <\/ol>\n  <\/section>\n    <div class=\"hub\"><b>صاحب المحل (المدير)<\/b><span>كل الصلاحيات<\/span><\/div>\n    <div class=\"trunk\" aria-hidden=\"true\"><\/div>\n    <div class=\"branches\">\n\n      <div class=\"branch\"><div class=\"bh\"><span class=\"node\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"17\" rx=\"2\"/><path d=\"M3 9h18M8 2v4M16 2v4\"/><\/svg><\/span><h3>الحجوزات<small>تبويب «الحجوزات» والزرار العائم «حجز جديد»<\/small><\/h3><\/div>\n        <ul class=\"leaves\">\n          <li><details class=\"leaf\"><summary>حجز جديد<\/summary><div class=\"how\"><ol><li>اختار الفستان (بحث أو مسح الباركود).<\/li><li>اكتب تاريخ الاستلام والإرجاع؛ السيستم بيقولك لو الفستان محجوز.<\/li><li>اختار العميلة أو ضيف واحدة جديدة.<\/li><li>تقدر تغيّر السعر وتعمل أي خصم، وتختار الموظف المسؤول (العمولة بتتحسب له).<\/li><li>اكتب العربون وطريقة الدفع، ودوس «تأكيد الحجز».<\/li><\/ol><\/div><\/details><\/li>\n          <li><details class=\"leaf\"><summary>تعديل الحجز<\/summary><div class=\"how\">تغيير الفستان أو المواعيد أو السعر أو الخصم أو الموظف. السيستم بيتأكد إن المواعيد الجديدة مافيهاش تعارض.<\/div><\/details><\/li>\n          <li><details class=\"leaf\"><summary>إلغاء الحجز ورد الفلوس<\/summary><div class=\"how\">«إلغاء الحجز» بيخلي الحجز ملغي ويفضل في التاريخ. لو هترجّع فلوس للعميلة، دوس «رد فلوس للعميلة». العربون اللي ماترجعش بيظهر في التقرير كإيراد.<\/div><\/details><\/li>\n          <li><details class=\"leaf\"><summary>حذف الحجز <span class=\"tag t-new\">جديد<\/span><\/summary><div class=\"how\">بيمسح الحجز وكل مدفوعاته نهائياً من الحسابات. مش متاح لو الفستان مع العميلة. استخدمه للحجوزات اللي اتسجلت غلط بس؛ لو العميلة لغت استخدم «إلغاء».<\/div><\/details><\/li>\n          <li><details class=\"leaf\"><summary>واتساب: تذكير وإيصال<\/summary><div class=\"how\">من صفحة الحجز: تذكير بالاستلام، تذكير بالإرجاع، وإيصال فيه الصافي والمدفوع والمتبقي.<\/div><\/details><\/li>\n        <\/ul><\/div>\n\n      <div class=\"branch\"><div class=\"bh\"><span class=\"node\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M20 7 9 18l-5-5\"/><\/svg><\/span><h3>التسليم والإرجاع<small>من صفحة الحجز<\/small><\/h3><\/div>\n        <ul class=\"leaves\">\n          <li><details class=\"leaf\" open><summary>تحصيل الباقي عند التسليم <span class=\"tag t-auto\">تلقائي<\/span><\/summary><div class=\"how\"><ol><li>دوس «اتسلم للعميلة».<\/li><li>هيظهر الصافي واللي اتدفع والباقي.<\/li><li>اختار طريقة الدفع (كاش، فودافون كاش...).<\/li><li>دوس «تم التسليم وتحصيل ...»: الدفعة بتتسجل لوحدها باسمك والحجز يبقى مدفوع بالكامل.<\/li><\/ol><\/div><\/details><\/li>\n          <li><details class=\"leaf\"><summary>الفستان رجع<\/summary><div class=\"how\">اختار «رجع ومحتاج تنظيف» (بيروح الدراي كلين ومايبانش متاح) أو «رجع وجاهز على طول» (بيرجع المعرض).<\/div><\/details><\/li>\n          <li><details class=\"leaf\"><summary>المتأخرات<\/summary><div class=\"how\">الرئيسية بتطلّع الفساتين المتأخرة بالأحمر وعدد أيام التأخير، ومنها تتصل أو تبعت واتساب.<\/div><\/details><\/li>\n        <\/ul><\/div>\n\n      <div class=\"branch\"><div class=\"bh\"><span class=\"node\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M9 3h6l-1 4 4 14H6l4-14z\"/><\/svg><\/span><h3>الفساتين<small>تبويب «الفساتين»<\/small><\/h3><\/div>\n        <ul class=\"leaves\">\n          <li><details class=\"leaf\"><summary>فستان جديد بصورة <span class=\"tag t-new\">جديد<\/span><\/summary><div class=\"how\"><ol><li>«فستان جديد» واكتب الوصف والنوع واللون والمقاس وسعر الإيجار.<\/li><li>اكتب تكلفة الشراء وتاريخه (مهمين للتقرير والإهلاك).<\/li><li>«صوّر أو اختار صورة» من الكاميرا أو المعرض؛ الصورة بتتصغّر لوحدها.<\/li><li>«حفظ الفستان». الكود بيتعمل لوحده (DR-0001...).<\/li><\/ol>الصورة بتتحفظ في فولدر «صور الفساتين» على درايف بتاعك.<\/div><\/details><\/li>\n          <li><details class=\"leaf\"><summary>تغيير الصورة أو السعر<\/summary><div class=\"how\">من صفحة الفستان: «تغيير الصورة» أو علامة القلم للتعديل.<\/div><\/details><\/li>\n          <li><details class=\"leaf\"><summary>المكان والحالة الفنية<\/summary><div class=\"how\">المكان: المعرض، المخزن، الدراي كلين، الخياطة. الحالة: جاهز، تنظيف، صيانة، خارج الخدمة (المدير بس).<\/div><\/details><\/li>\n          <li><details class=\"leaf\"><summary>حذف الفستان <span class=\"tag t-new\">جديد<\/span><\/summary><div class=\"how\">مسموح بس لو الفستان مالوش أي حجز. لو ليه تاريخ وماعدتش هتأجره، خليه «خارج الخدمة».<\/div><\/details><\/li>\n          <li><div class=\"plain\">ملصقات الباركود: من تبويب «ملصقات الباركود» في الشيت، اطبعها والزقها على الشماعة.<\/div><\/li>\n        <\/ul><\/div>\n\n      <div class=\"branch\"><div class=\"bh\"><span class=\"node\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"9\" cy=\"8\" r=\"4\"/><path d=\"M2 21a7 7 0 0 1 14 0\"/><\/svg><\/span><h3>العملاء<small>تبويب «العملاء»<\/small><\/h3><\/div>\n        <ul class=\"leaves\">\n          <li><details class=\"leaf\"><summary>ملف العميلة<\/summary><div class=\"how\">التليفون، المقاسات، العنوان، كل حجوزاتها، اللي دفعته واللي عليها، واتساب واتصال بضغطة.<\/div><\/details><\/li>\n          <li><details class=\"leaf\"><summary>تقييم العميلة <span class=\"tag t-new\">جديد<\/span><\/summary><div class=\"how\"><ol><li>افتح ملف العميلة.<\/li><li>دوس على عدد النجوم من 1 لـ 5، واكتب السبب لو حابب.<\/li><li>«حفظ التقييم».<\/li><\/ol>التقييم بيظهر جنب اسمها في القوائم وفي الحجز، ولو 2 نجمة أو أقل بيطلع تحذير للي بيحجز لها. الموظفين بيشوفوا التقييم بس مايقدروش يغيروه.<\/div><\/details><\/li>\n          <li><details class=\"leaf\"><summary>حذف عميلة <span class=\"tag t-new\">جديد<\/span><\/summary><div class=\"how\">مسموح لو مالهاش حجوزات. رقم التليفون مايتكررش لعميلتين.<\/div><\/details><\/li>\n        <\/ul><\/div>\n\n      <div class=\"branch\"><div class=\"bh\"><span class=\"node\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M21 8 12 3 3 8v8l9 5 9-5z\"/><path d=\"M3 8l9 5 9-5\"/><\/svg><\/span><h3>المخزن<small>الفساتين ← «المخزن»<\/small><\/h3><\/div>\n        <ul class=\"leaves\">\n          <li><details class=\"leaf\"><summary>المستلزمات<\/summary><div class=\"how\">أكياس، شماعات، منظفات... لكل صنف رصيد وحد تنبيه. لما يقرب يخلص بيظهر تنبيه في الرئيسية.<\/div><\/details><\/li>\n          <li><details class=\"leaf\"><summary>وارد / منصرف / تسوية<\/summary><div class=\"how\">«إضافة (شراء)» وتقدر تسجّلها كمصروف. «صرف» للاستخدام. «تسوية بعد الجرد» لتصحيح الرصيد.<\/div><\/details><\/li>\n          <li><details class=\"leaf\"><summary>حذف حركة <span class=\"tag t-new\">جديد<\/span><\/summary><div class=\"how\">علامة الزبالة جنب الحركة. مش هيقبل لو الرصيد هيبقى بالسالب. لو الشراء اتسجل كمصروف امسحه من الحسابات كمان.<\/div><\/details><\/li>\n          <li><div class=\"plain\">أماكن الفساتين: كام فستان في المعرض والمخزن والدراي كلين ومع العملاء.<\/div><\/li>\n        <\/ul><\/div>\n\n      <div class=\"branch\"><div class=\"bh\"><span class=\"node\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"2\" y=\"6\" width=\"20\" height=\"12\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"2.5\"/><\/svg><\/span><h3>الحسابات<small>الإدارة ← «الحسابات» و«العمولات»<\/small><\/h3><\/div>\n        <ul class=\"leaves\">\n          <li><details class=\"leaf\"><summary>ملخص الشهر وحركة الفلوس<\/summary><div class=\"how\">قيمة الحجوزات، المحصّل، المصروفات الثابتة والمتغيرة، الربح التشغيلي، وكل دفعة ومصروف بالتاريخ. غيّر الشهر بالأسهم فوق.<\/div><\/details><\/li>\n          <li><details class=\"leaf\"><summary>تسجيل مصروف<\/summary><div class=\"how\">اختار البند، المبلغ، التاريخ، وفستان لو المصروف خاص بيه (تنظيف أو تعديل).<\/div><\/details><\/li>\n          <li><details class=\"leaf\"><summary>حذف دفعة أو مصروف <span class=\"tag t-new\">جديد<\/span><\/summary><div class=\"how\">علامة الزبالة جنب السطر في «حركة الفلوس» أو في مدفوعات الحجز. كل حذف بيتسجل في تبويب «سجل الحذف» في الشيت.<\/div><\/details><\/li>\n          <li><details class=\"leaf\"><summary>العمولات<\/summary><div class=\"how\">عمولة كل موظف = صافي الحجز × نسبته، وبتبقى مستحقة لما الحجز يتحصّل كله. «صرف العمولة» بيسجلها كمصروف.<\/div><\/details><\/li>\n        <\/ul><\/div>\n\n      <div class=\"branch\"><div class=\"bh\"><span class=\"node\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M4 20V10M10 20V4M16 20v-7M22 20H2\"/><\/svg><\/span><h3>لوحة المؤشرات<small>الإدارة ← «المؤشرات»<\/small> <\/h3><\/div>\n        <ul class=\"leaves\">\n          <li><details class=\"leaf\"><summary>المالية<\/summary><div class=\"how\">الإيرادات ونموها عن الشهر اللي فات، صافي الربح والهامش، المحصّل، متوسط الحجز، نقطة التعادل ونسبة تحقيقها.<\/div><\/details><\/li>\n          <li><details class=\"leaf\"><summary>رسوم تفاعلية<\/summary><div class=\"how\">الإيرادات مقابل التكاليف، صافي الربح، عدد الحجوزات، نسبة الإشغال. دوس على أي شهر في الرسم يتغير كل الأرقام لشهره. اختار الفترة: 3 أو 6 أو 12 شهر. «عرض الأرقام» تحت كل رسم بيفتح جدول.<\/div><\/details><\/li>\n          <li><details class=\"leaf\"><summary>النمو والعملاء<\/summary><div class=\"how\">عملاء جدد، نسبة اللي رجعوا تاني، نسبة الإلغاء والخصم، الحجوزات الجاية وقيمتها.<\/div><\/details><\/li>\n          <li><details class=\"leaf\"><summary>التشغيل والفساتين<\/summary><div class=\"how\">نسبة إشغال الفساتين، الفساتين اللي ماتأجرتش آخر شهرين، أكتر الفساتين دخلاً وكام رجّعت من تمنها، المصروفات حسب البند، الإيراد حسب النوع، وأداء كل موظف.<\/div><\/details><\/li>\n        <\/ul><\/div>\n\n      <div class=\"branch\"><div class=\"bh\"><span class=\"node\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 2h9l5 5v15H6z\"/><path d=\"M14 2v6h6M9 13h8M9 17h8\"/><\/svg><\/span><h3>التقرير الشهري<small>الإدارة ← «التقرير»<\/small><\/h3><\/div>\n        <ul class=\"leaves\">\n          <li><details class=\"leaf\"><summary>3 قوائم مالية<\/summary><div class=\"how\"><ul><li><b>قائمة الدخل:<\/b> الإيرادات ← المتغيرة والعمولات ← هامش المساهمة ← الثابتة والإهلاك ← صافي الربح.<\/li><li><b>التدفقات النقدية:<\/b> النقدية أول الشهر، العرابين والدفعات، المصروفات، الشراء، النقدية آخر الشهر، وحسب طريقة الدفع.<\/li><li><b>المركز المالي:<\/b> النقدية، فلوس عند العملاء، المخزون، الفساتين بعد الإهلاك، العرابين المقدمة، العمولات المستحقة، وصافي قيمة المشروع.<\/li><\/ul><\/div><\/details><\/li>\n          <li><details class=\"leaf\"><summary>توصيات ذكية <span class=\"tag t-auto\">تلقائي<\/span><\/summary><div class=\"how\">السيستم بيحلل الأرقام ويطلع توصيات مرتبة بالأهمية (أحمر عاجل، ذهبي مهم، أخضر فرصة).<\/div><\/details><\/li>\n          <li><details class=\"leaf\"><summary>توصيات Gemini AI<\/summary><div class=\"how\">بعد ما تحط المفتاح في الإعدادات، دوس «اطلب توصيات من Gemini». بيتبعتله أرقام الشهر بس، من غير أسماء أو تليفونات.<\/div><\/details><\/li>\n          <li><details class=\"leaf\"><summary>الإيميل <span class=\"tag t-auto\">أول كل شهر<\/span><\/summary><div class=\"how\">أول كل شهر الساعة 8 الصبح بيوصلك إيميل بتقرير الشهر اللي خلص، وبيتحفظ في تبويب «التقارير الشهرية». تقدر تبعته في أي وقت بـ«ابعته على الإيميل».<\/div><\/details><\/li>\n        <\/ul><\/div>\n\n      <div class=\"branch\"><div class=\"bh\"><span class=\"node\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2\"/><\/svg><\/span><h3>الإعدادات والمستخدمين<small>الإدارة ← علامة الترس<\/small><\/h3><\/div>\n        <ul class=\"leaves\">\n          <li><details class=\"leaf\"><summary>إعدادات المحل<\/summary><div class=\"how\">الاسم، العمولة الافتراضية، أقصى خصم للموظف، أيام التجهيز بين الحجزين، واتساب المحل.<\/div><\/details><\/li>\n          <li><details class=\"leaf\"><summary>إعدادات التقرير <span class=\"tag t-new\">جديد<\/span><\/summary><div class=\"how\">إيميل التقرير، مدة إهلاك الفستان (افتراضي 24 شهر)، الرصيد النقدي الافتتاحي (الكاش اللي بدأت بيه)، مفتاح Gemini.<\/div><\/details><\/li>\n          <li><details class=\"leaf\"><summary>الموظفين<\/summary><div class=\"how\">إضافة موظف بدور ورقم سري 6 أرقام ونسبة عمولة خاصة. تغيير الرقم أو إيقاف الموظف بيخرّجه من التطبيق فوراً.<\/div><\/details><\/li>\n        <\/ul><\/div>\n\n      <div class=\"branch\"><div class=\"bh\"><span class=\"node\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"/><path d=\"M8 11V7a4 4 0 0 1 8 0v4\"/><\/svg><\/span><h3>الأمان<small>شغال لوحده<\/small><\/h3><\/div>\n        <ul class=\"leaves\">\n          <li><div class=\"plain\">رقم سري 6 أرقام، و10 محاولات غلط بتقفل الدخول ربع ساعة.<\/div><\/li>\n          <li><div class=\"plain\">أقصى 8 أجهزة لكل مستخدم، والجلسة بتنتهي بعد 30 يوم.<\/div><\/li>\n          <li><div class=\"plain\">كل حذف متسجل باسم اللي عمله في «سجل الحذف».<\/div><\/li>\n          <li><div class=\"plain\">الشيت والصور على حساب جوجل بتاعك إنت بس.<\/div><\/li>\n        <\/ul><\/div>\n    <\/div>\n    <p class=\"note\" style=\"margin-top:18px\"><b>الشيت نفسه:<\/b> كل حاجة في التطبيق بتتسجل في Google Sheet. من قائمة <kbd>🌙 Moon Wedding dress<\/kbd> فوق في الشيت تقدر تفتح لينك التطبيق، تبعت تقرير الشهر اللي فات على الإيميل، أو تحدّث النظام.<\/p>\n  ", "staff": "<section class=\"cycle\" aria-label=\"دورة الحجز\">\n    <h2>دورة أي حجز من أوله لآخره<\/h2>\n    <ol class=\"steps\">\n      <li><b>الحجز<\/b>فستان + مواعيد + عميلة. السيستم بيمنع أي تعارض لوحده.<\/li>\n      <li><b>العربون<\/b>بيتسجل مع الحجز باسم اللي استلمه.<\/li>\n      <li><b>التذكير<\/b>رسالة واتساب جاهزة قبل الميعاد.<\/li>\n      <li><b>يوم الاستلام<\/b>دوس «اتسلم للعميلة»، والباقي بيتحصّل تلقائياً.<\/li>\n      <li><b>الإرجاع<\/b>«الفستان رجع»: محتاج تنظيف أو جاهز.<\/li>\n      <li><b>التنظيف<\/b>الفستان يروح الدراي كلين، ولما يرجع تخليه «جاهز».<\/li>\n    <\/ol>\n  <\/section>\n    <div class=\"hub\"><b>الموظف<\/b><span>الحجز والتسليم واستلام الفلوس<\/span><\/div>\n    <div class=\"trunk\" aria-hidden=\"true\"><\/div>\n    <div class=\"branches\">\n\n      <div class=\"branch\"><div class=\"bh\"><span class=\"node\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z\"/><\/svg><\/span><h3>أول ما تفتح<small>الرئيسية<\/small><\/h3><\/div>\n        <ul class=\"leaves\">\n          <li><details class=\"leaf\"><summary>الدخول<\/summary><div class=\"how\">اكتب الرقم السري (6 أرقام) اللي ادّاهولك المدير. التطبيق بيفتكرك على موبايلك.<\/div><\/details><\/li>\n          <li><details class=\"leaf\"><summary>شغل النهارده<\/summary><div class=\"how\">استلامات النهارده، إرجاعات النهارده، المتأخرات بالأحمر، والفساتين المتاحة. أي مربع تدوس عليه بيفتح القائمة بتاعته.<\/div><\/details><\/li>\n          <li><div class=\"plain\">لو ظهر تنبيه مخزن، بلّغ المدير إن الصنف قرب يخلص.<\/div><\/li>\n        <\/ul><\/div>\n\n      <div class=\"branch\"><div class=\"bh\"><span class=\"node\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M12 5v14M5 12h14\"/><\/svg><\/span><h3>حجز جديد<small>الزرار الذهبي «حجز جديد»<\/small><\/h3><\/div>\n        <ul class=\"leaves\">\n          <li><details class=\"leaf\" open><summary>الخطوات<\/summary><div class=\"how\"><ol><li>اختار الفستان بالبحث أو امسح الباركود.<\/li><li>اكتب تاريخ الاستلام والإرجاع؛ لو ظهر أحمر يبقى الفستان محجوز.<\/li><li>دوّر على العميلة بالاسم أو الرقم، أو «عميلة جديدة».<\/li><li>السعر بييجي من الفستان. الخصم في حدود النسبة اللي حددها المدير.<\/li><li>اكتب العربون وطريقة الدفع ودوس «تأكيد الحجز».<\/li><\/ol><\/div><\/details><\/li>\n          <li><div class=\"plain\">الحجز والعربون بيتسجلوا باسمك، والعمولة بتتحسب لك.<\/div><\/li>\n          <li><div class=\"plain\">ابعت للعميلة «إيصال واتساب» من صفحة الحجز.<\/div><\/li>\n        <\/ul><\/div>\n\n      <div class=\"branch\"><div class=\"bh\"><span class=\"node\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M20 7 9 18l-5-5\"/><\/svg><\/span><h3>يوم الاستلام<small>صفحة الحجز ← «اتسلم للعميلة»<\/small><\/h3><\/div>\n        <ul class=\"leaves\">\n          <li><details class=\"leaf\" open><summary>تحصيل الباقي <span class=\"tag t-auto\">تلقائي<\/span><\/summary><div class=\"how\"><ol><li>قبل ما تسلّم، قول للعميلة المبلغ الباقي اللي ظاهر.<\/li><li>اختار هتدفع إزاي (كاش، فودافون كاش، إنستاباي...).<\/li><li>دوس «تم التسليم وتحصيل ...».<\/li><\/ol>المبلغ بيتسجل إنك إنت استلمته، فاتأكد إنك قبضته فعلاً قبل ما تدوس.<\/div><\/details><\/li>\n          <li><div class=\"plain\">لو الحجز مدفوع كله هيظهر «مدفوع بالكامل» وتأكد التسليم على طول.<\/div><\/li>\n        <\/ul><\/div>\n\n      <div class=\"branch\"><div class=\"bh\"><span class=\"node\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M21 12a9 9 0 1 1-3-6.7L21 8\"/><path d=\"M21 3v5h-5\"/><\/svg><\/span><h3>يوم الإرجاع<small>صفحة الحجز ← «الفستان رجع»<\/small><\/h3><\/div>\n        <ul class=\"leaves\">\n          <li><details class=\"leaf\"><summary>رجع ومحتاج تنظيف<\/summary><div class=\"how\">الفستان بيتسجل «تنظيف» ومكانه «الدراي كلين»، ومش هيبان متاح للحجز. لما يرجع من التنظيف افتح الفستان وخلّي حالته «جاهز».<\/div><\/details><\/li>\n          <li><details class=\"leaf\"><summary>رجع وجاهز<\/summary><div class=\"how\">بيرجع «المعرض» ومتاح على طول.<\/div><\/details><\/li>\n          <li><div class=\"plain\">لو العميلة اتأخرت، اتصل بيها أو ابعت «تذكير بالإرجاع» واتساب.<\/div><\/li>\n        <\/ul><\/div>\n\n      <div class=\"branch\"><div class=\"bh\"><span class=\"node\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M9 3h6l-1 4 4 14H6l4-14z\"/><\/svg><\/span><h3>الفساتين والمخزن<small>تبويب «الفساتين»<\/small><\/h3><\/div>\n        <ul class=\"leaves\">\n          <li><details class=\"leaf\"><summary>البحث والباركود<\/summary><div class=\"how\">اكتب الكود أو اللون أو المقاس، أو دوس أيقونة الباركود وصوّر الملصق اللي على الشماعة.<\/div><\/details><\/li>\n          <li><details class=\"leaf\"><summary>صورة الفستان<\/summary><div class=\"how\">بتظهر في صفحة الفستان؛ ورّيها للعميلة من الموبايل. دوس عليها تكبر.<\/div><\/details><\/li>\n          <li><details class=\"leaf\"><summary>المكان والحالة<\/summary><div class=\"how\">غيّر مكان الفستان (معرض، مخزن، دراي كلين، خياطة) وحالته (جاهز، تنظيف، صيانة).<\/div><\/details><\/li>\n          <li><details class=\"leaf\"><summary>صرف من المخزن<\/summary><div class=\"how\">المخزن ← الصنف ← «صرف / استخدام» واكتب الكمية. مش هيقبل أكتر من الرصيد.<\/div><\/details><\/li>\n        <\/ul><\/div>\n\n      <div class=\"branch\"><div class=\"bh\"><span class=\"node\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"9\" cy=\"8\" r=\"4\"/><path d=\"M2 21a7 7 0 0 1 14 0\"/><\/svg><\/span><h3>العملاء والفلوس<small>«العملاء» و«تسجيل دفعة»<\/small><\/h3><\/div>\n        <ul class=\"leaves\">\n          <li><details class=\"leaf\"><summary>تقييم العميلة<\/summary><div class=\"how\">النجوم جنب اسم العميلة هي تقييم المدير ليها. لو ظهر تحذير «تقييم ضعيف» وانت بتحجز، خد عربون أكبر واتأكد من بياناتها.<\/div><\/details><\/li>\n          <li><details class=\"leaf\"><summary>إضافة أو تعديل عميلة<\/summary><div class=\"how\">الاسم والرقم مطلوبين، والمقاسات والعنوان اختياري. الرقم مايتكررش.<\/div><\/details><\/li>\n          <li><details class=\"leaf\"><summary>تسجيل دفعة<\/summary><div class=\"how\">لو العميلة دفعت جزء قبل الاستلام: صفحة الحجز ← «تسجيل دفعة» ← المبلغ وطريقة الدفع.<\/div><\/details><\/li>\n        <\/ul><\/div>\n\n      <div class=\"branch\"><div class=\"bh\"><span class=\"node\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"2\" y=\"6\" width=\"20\" height=\"12\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"2.5\"/><\/svg><\/span><h3>حسابي<small>آخر تبويب تحت<\/small><\/h3><\/div>\n        <ul class=\"leaves\">\n          <li><div class=\"plain\">حجوزاتك الشهر ده وقيمتها.<\/div><\/li>\n          <li><div class=\"plain\">عمولتك، والمستحق لك من الحجوزات اللي اتحصّلت كلها.<\/div><\/li>\n          <li><div class=\"plain\">اللي اتصرف لك والباقي لك.<\/div><\/li>\n          <li><div class=\"plain\">«تسجيل خروج» لو الموبايل مش بتاعك.<\/div><\/li>\n        <\/ul><\/div>\n\n      <div class=\"branch\"><div class=\"bh\"><span class=\"node\" style=\"background:var(--redbg);color:var(--red)\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M5.6 5.6l12.8 12.8\"/><\/svg><\/span><h3>للمدير بس<small>مش هتلاقيها عندك<\/small><\/h3><\/div>\n        <ul class=\"leaves\">\n          <li><div class=\"plain\"><span class=\"tag t-no\">ممنوع<\/span> تعديل أو إلغاء أو حذف حجز، ورد فلوس.<\/div><\/li>\n          <li><div class=\"plain\"><span class=\"tag t-no\">ممنوع<\/span> تكلفة الفساتين والمصروفات والتقارير والمؤشرات.<\/div><\/li>\n          <li><div class=\"plain\"><span class=\"tag t-no\">ممنوع<\/span> إضافة فستان أو صنف، أو شراء وتسوية مخزن.<\/div><\/li>\n          <li><div class=\"plain\"><span class=\"tag t-no\">ممنوع<\/span> عمولات باقي الموظفين والإعدادات.<\/div><\/li>\n        <\/ul><\/div>\n    <\/div>\n    <p class=\"note\" style=\"margin-top:18px\"><b>قاعدة ذهبية:<\/b> أي فلوس تستلمها لازم تتسجل في نفس اللحظة من التطبيق، لأنها بتتسجل باسمك وبتدخل في حساب عمولتك.<\/p>\n  "};

 if(o.E.length)h+='<details class="tbl"><summary>الحركات ('+o.E.length+')</summary>'+o.E.map(function(p){return '<div class="crow"><div class="col"><b>'+esc(p.type)+'</b><span class="sub">'+esc(p.date)+(p.notes?' · '+esc(p.notes):'')+'</span></div><b class="money">'+money(p.amount)+'</b>'+(adminView?delBtn('payroll',p.r,{date:p.date,amount:p.amount},'حذف الحركة؟',p.type+' '+money(p.amount)+' لـ '+name+(p.type==='سلفة'||p.type==='صرف مرتب'?' (امسح المصروف المرتبط بيها من الحسابات كمان)':'')):'')+'</div>'}).join('')+'</details>';
 return h}

 return h}

  return h}
 h+='<div class="seg" style="margin-top:14px"><button class="'+(t==='مورد'?'on':'')+'" onclick="LG.t=\'مورد\';draw()">الموردين</button><button class="'+(t==='مدين'?'on':'')+'" onclick="LG.t=\'مدين\';draw()">المدينين</button></div>';

 h+='<p class="sub" style="margin:10px 0 0;line-height:1.8">'+(t==='مورد'?'<b>فاتورة</b> = اشترينا بالآجل (بتتحسب مصروف "مشتريات من موردين"). <b>دفعة</b> = دفعنا له.':'<b>سلفة/دين</b> = فلوس طلعت لحد ولسه هترجع. <b>تحصيل</b> = رجّعها.')+'</p>';
 h+='<div class="stack" style="margin-top:12px">'+(P.length?P.map(function(p){return '<button class="card row" onclick="LG.p='+jsa(p.name)+';draw()"><div class="av">'+ic('users',20)+'</div><div class="col"><b>'+esc(p.name)+'</b><span class="sub">'+p.n+' حركة · آخر حركة '+esc(p.last)+'</span></div><b class="money" style="color:'+(p.bal>0.5?'var(--red)':'var(--grn)')+'">'+money(p.bal)+'</b></button>'}).join(''):'<div class="card empty">مفيش '+(t==='مورد'?'موردين':'مدينين')+' لسه. دوس + علشان تضيف.</div>')+'</div>';
 return h}

var CH={t:null,timer:null};
function chThreads(){var me=D.me.name,T=[{k:'الكل',n:'القناة العامة (كل الموظفين)'}];
 if(admin())(D.users||[]).filter(function(u){return u.active&&u.name!==me}).forEach(function(u){T.push({k:u.name,n:u.name+(u.role==='مدير'?' (مدير)':'')})});else T.push({k:'ADMIN',n:'المدير'});return T}
function chIn(m,k){var me=D.me.name;if(k==='الكل')return m.to==='الكل';if(k==='ADMIN')return (m.f===me&&m.to==='ADMIN')||m.to===me;return (m.f===k&&(m.to==='ADMIN'||m.to===me))||(m.to===k&&m.f===me)||(admin()&&m.to===k)}
function chSeen(k){return Number(lsGet('chs_'+D.me.name+'_'+k)||0)}
function chUnreadIn(k){var s=chSeen(k),me=D.me.name;return (D.msgs||[]).filter(function(m){return m.t>s&&m.f!==me&&chIn(m,k)}).length}
function chatUnread(){if(!D||!D.msgs)return 0;return chThreads().reduce(function(x,t){return x+chUnreadIn(t.k)},0)}
function vChat(){var T=chThreads();
 if(!CH.t)return hdr('الرسائل',"go('home')")+'<div class="stack" style="margin-top:14px">'+T.map(function(t){var L=(D.msgs||[]).filter(function(m){return chIn(m,t.k)}),last=L[L.length-1],u=chUnreadIn(t.k);return '<button class="card row" onclick="CH.t='+jsa(t.k)+';draw()"><div class="av hbtn">'+ic(t.k==='الكل'?'users':'chat',20)+(u?'<span class="badge">'+u+'</span>':'')+'</div><div class="col"><b>'+esc(t.n)+'</b><span class="sub" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+(last?esc((last.f===D.me.name?'إنت: ':last.f+': ')+last.x):'مفيش رسائل لسه')+'</span></div></button>'}).join('')+'</div>';
 var th=T.filter(function(t){return t.k===CH.t})[0]||{n:CH.t};
 return hdr(esc(th.n),"CH.t=null;draw()")+'<div class="chat" id="chatLog"></div><div class="chatin"><textarea id="chatQ" rows="1" placeholder="اكتب رسالة..." onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();chatSend()}"></textarea><button class="btn pri" style="min-width:56px" aria-label="إرسال" onclick="chatSend()">'+ic('send',20)+'</button></div>'}
function chatDraw(){var el=$('chatLog');if(!el||!CH.t)return;var me=D.me.name,L=(D.msgs||[]).filter(function(m){return chIn(m,CH.t)});
 setH(el,L.length?L.map(function(m){var d=new Date(m.t),tm=m.t?('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+' · '+d.getDate()+'/'+(d.getMonth()+1):'';return '<div class="bub '+(m.f===me?'me':'o')+'">'+(m.f!==me&&CH.t==='الكل'?'<b style="font-size:13px;color:var(--ac)">'+esc(m.f)+'</b><br>':'')+esc(m.x)+'<small>'+tm+'</small></div>'}).join(''):'<div class="empty">ابدأ المحادثة 👋</div>');
 el.scrollTop=el.scrollHeight;lsSet('chs_'+me+'_'+CH.t,String(Date.now()))}
function chatAfter(){chatDraw();if(!CH.timer)CH.timer=setInterval(chatPoll,12000)}
function chatStop(){if(CH.timer){clearInterval(CH.timer);CH.timer=null}}
function chatPoll(){if(V.s!=='chat'||document.visibilityState!=='visible')return;quiet('appChat',[],function(res){if(!Array.isArray(res))return;var ch=res.length!==(D.msgs||[]).length;D.msgs=res;if(ch){if(CH.t)chatDraw();else draw()}})}
function chatSend(){var q=$('chatQ'),t=(q.value||'').trim();if(!t||!CH.t)return;q.value='';D.msgs=(D.msgs||[]).concat([{t:Date.now(),f:D.me.name,to:CH.t,x:t}]);chatDraw();quiet('appSendMsg',[CH.t,t],function(res){if(Array.isArray(res)){D.msgs=res;chatDraw()}},function(e){toast('الرسالة ماتبعتتش: '+e)})}

/* ---------- زرار المساعد: بيتسحب لأي مكان + الصوت ---------- */
function aiDrag(b){try{var p=JSON.parse(lsGet('aiPos')||'null');if(p){b.style.left=Math.min(innerWidth-60,Math.max(4,p.x))+'px';b.style.top=Math.min(innerHeight-60,Math.max(4,p.y))+'px';b.style.right='auto';b.style.bottom='auto'}}catch(e){}
 var sx=0,sy=0,ox=0,oy=0,mv=false,id=null;
 b.addEventListener('pointerdown',function(e){id=e.pointerId;sx=e.clientX;sy=e.clientY;var r=b.getBoundingClientRect();ox=r.left;oy=r.top;mv=false;try{b.setPointerCapture(id)}catch(x){}});
 b.addEventListener('pointermove',function(e){if(id!==e.pointerId)return;var dx=e.clientX-sx,dy=e.clientY-sy;if(!mv&&Math.abs(dx)+Math.abs(dy)<8)return;mv=true;b.classList.add('drag');b.style.left=Math.min(innerWidth-60,Math.max(4,ox+dx))+'px';b.style.top=Math.min(innerHeight-60,Math.max(4,oy+dy))+'px';b.style.right='auto';b.style.bottom='auto'});
 var end=function(e){if(id!==e.pointerId)return;id=null;b.classList.remove('drag');if(mv)lsSet('aiPos',JSON.stringify({x:parseInt(b.style.left,10),y:parseInt(b.style.top,10)}));else if(e.type==='pointerup')aiOpen()};
 b.addEventListener('pointerup',end);b.addEventListener('pointercancel',end)}
var AIREC=null;
function aiVoice(){if(!SRC)return toast('المتصفح ده مش بيدعم الكلام. جرّب Chrome');if(AIREC){try{AIREC.stop()}catch(e){}return}

function doStatus(code,st,clean,method){run('appSetStatus',[code,st,!!clean,method||''],function(){toast('اتسجل: '+st);closeSheet();draw()})}

 openSheet('<h2>تسليم الخدمة للمريض</h2><p class="sub">'+esc(b.name)+' · '+esc(b.dressDesc)+'</p>'+(rem?'<div class="card" style="margin:10px 0;background:var(--ambbg);border-color:var(--ambbg)"><div class="kv"><span>صافي الموعد</span><b class="money">'+money(b.net)+'</b></div><div class="kv"><span>اتدفع قبل كده</span><b class="money">'+money(b.paid)+'</b></div><div class="kv"><span><b>الباقي اللي هيتحصّل دلوقتي</b></span><b class="money" style="color:var(--red);font-size:18px">'+money(b.remaining)+'</b></div></div><p class="sub" style="margin:0 0 10px">شرط العيادة: الباقي بيتدفع يوم الاستلام. لما تدوس تأكيد، المبلغ هيتسجل إن '+esc(D.me.name)+' استلمه.</p><label class="f" style="margin-bottom:12px">طريقة الدفع<select id="dMet">'+methodOpts()+'</select></label>':'<div class="ok" style="margin:10px 0">✓ الموعد مدفوع بالكامل</div>')+'<div class="stack"><button class="btn pri" onclick="doStatus('+jsa(code)+','+jsa(ST.OUT)+',false,$(\'dMet\')?$(\'dMet\').value:\'\')">'+(rem?'تم التسليم وتحصيل '+money(b.remaining):'تأكيد التسليم')+'</button><button class="btn" onclick="closeSheet()">رجوع</button></div>')}
function askReturn(code){openSheet('<h2>الخدمة رجع</h2><p class="sub">لو الخدمة محتاج تنظيف قبل الموعد اللي بعده، هيتسجل "تنظيف" ومش هيبان متاح لحد ما ترجّعه "جاهز".</p><div class="stack"><button class="btn pri" onclick="doStatus('+jsa(code)+','+jsa(ST.BACK)+',true)">رجع ومحتاج تنظيف</button><button class="btn" onclick="doStatus('+jsa(code)+','+jsa(ST.BACK)+',false)">رجع وجاهز على طول</button></div><details class="card" style="margin-top:12px;border-color:#EACCC6"><summary style="cursor:pointer;font-weight:700;color:var(--red)">الخدمة رجع وفيه تلفيات؟</summary><div class="stack" style="margin-top:10px"><label class="f">وصف التلفيات<textarea id="dmN" rows="2" placeholder="مثال: قطع في الديل، بقعة مش بتطلع"></textarea></label><label class="f">تعويض على المريض (اختياري)<input id="dmF" type="number" inputmode="numeric" min="0" placeholder="0"></label><p class="sub" style="margin:0">الخدمة هيتحول "صيانة"، والتعويض هيتضاف على حساب الموعد وتقدر تحصّله كدفعة.</p><button class="btn danger" onclick="doDamage('+jsa(code)+')">رجع وفيه تلفيات</button></div></details><button class="btn" style="width:100%;margin-top:10px" onclick="closeSheet()">رجوع</button>')}
function askCancel(code){var b=bookBy(code);openSheet('<h2>إلغاء الموعد '+esc(code)+'؟</h2><p class="sub">'+(b.paid>0?'المريض دافعة '+money(b.paid)+'. بعد الإلغاء تقدر تسجّل رد الفلوس لو هترجعها.':'')+'</p><div class="stack"><button class="btn danger" onclick="doStatus('+jsa(code)+','+jsa(ST.CANCEL)+')">أيوه، إلغاء الموعد</button><button class="btn" onclick="closeSheet()">لا، رجوع</button></div>')}
function staffOpts(sel){return '<option value="">—</option>'+D.settings.staff.map(function(s){return '<option'+(s.name===sel?' selected':'')+'>'+esc(s.name)+'</option>'}).join('')}

function askPay(code,refund){var b=bookBy(code);openSheet('<h2>'+(refund?'رد فلوس للمريض':'تسجيل دفعة')+'</h2><p class="sub">'+esc(b.name)+' · '+(refund?'دافعة '+money(b.paid):'المتبقي '+money(b.remaining))+'</p><div class="stack"><label class="f">المبلغ<input id="pAmt" type="number" inputmode="numeric" min="1" value="'+(refund?b.paid:b.remaining)+'"></label><label class="f">طريقة الدفع<select id="pMet">'+methodOpts()+'</select></label><p class="sub" style="margin:0">هيتسجل إن '+esc(D.me.name)+' استلم المبلغ.</p><label class="f">ملاحظات<input id="pNote"></label><button class="btn pri" onclick="doPay('+jsa(code)+','+(refund?1:0)+')">حفظ</button><button class="btn" onclick="closeSheet()">رجوع</button></div>')}
function doPay(code,refund){var b=bookBy(code),amt=Number($('pAmt').value);var type=refund?'مرتجع للمريض':(amt>=b.remaining?'استكمال':'دفعة');run('appAddPayment',[code,amt,type,$('pMet').value,$('pNote').value],function(){toast('اتسجلت الدفعة ✓');closeSheet();draw()})}

function barChart(S,keys,fmt,title){var W=340,H=172,L=36,Rt=6,T=10,B=22,pw=W-L-Rt,ph=H-T-B,n=S.length;
 var all=[0];S.forEach(function(x){keys.forEach(function(k){all.push(x[k.k])})});
 var hi=Math.max.apply(null,all),lo=Math.min.apply(null,all),st=niceMax((hi-lo)/4)||1,mx=Math.ceil(hi/st)*st,mn=Math.floor(lo/st)*st;if(mx===mn)mx=mn+st;
 function y(v){return T+ph*(mx-v)/(mx-mn)}
 var g='',i,nt=Math.round((mx-mn)/st);for(i=0;i<=nt;i++){var v=mn+st*i;g+='<line x1="'+L+'" x2="'+(W-Rt)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'" stroke="'+(Math.abs(v)<1e-9?'#BDAF92':'#EFE6D2')+'" stroke-width="1"/><text x="'+(L-5)+'" y="'+(y(v)+3.5).toFixed(1)+'" font-size="10" text-anchor="end" fill="#8A7E68">'+shortN(v)+'</text>'}
 var gw=pw/n,nk=keys.length,bw=Math.max(4,Math.min(16,(gw*0.72-(nk-1)*2)/nk)),tot=nk*bw+(nk-1)*2,sel=null;
 S.forEach(function(x,j){var on=x.m===MONTH;if(on)sel=x;var x0=L+j*gw+(gw-tot)/2;
