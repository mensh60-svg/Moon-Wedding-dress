function itemBy(c){for(var i=0;i<D.stock.length;i++)if(D.stock[i].code===c)return D.stock[i];return null}
function listStock(){var el=$('slst');if(!el)return;var h='';
 if(FS.t==='sup'){var q=(FS.q||'').trim().toLowerCase();var L=(D.stock||[]).filter(function(x){return !q||(x.name+' '+x.cat+' '+x.code).toLowerCase().indexOf(q)>=0}).sort(function(a,b){var la=a.qty<=a.min?0:1,lb=b.qty<=b.min?0:1;return la-lb||(a.name<b.name?-1:1)});
  h=L.length?'<span class="sub">'+L.length+' صنف</span>'+L.map(function(x){return '<button class="card row" onclick="go(\'stockItem\',{c:'+jsa(x.code)+'})"><div class="av">'+ic('box',22)+'</div><div class="col"><b>'+esc(x.name)+'</b><span class="sub">'+esc([x.cat,'حد التنبيه '+x.min].filter(Boolean).join(' · '))+'</span></div><div class="stack" style="gap:6px;align-items:flex-end"><span class="qty">'+x.qty+' <span class="sub">'+esc(x.unit)+'</span></span>'+stockTag(x)+'</div></button>'}).join(''):'<div class="card empty">'+((D.stock||[]).length?'مفيش أصناف بالاسم ده':'المخزن فاضي'+(admin()?'. ضيف أول صنف (أكياس، شماعات، منظفات...).':'.'))+'</div>'}
 else if(FS.t==='loc'){var out=D.dresses.filter(function(d){return dressState(d).k==='out'});var groups=[['مع العميلة',out]].concat(D.locs.map(function(l){return [l,D.dresses.filter(function(d){return d.loc===l&&dressState(d).k!=='out'})]}));
  h='<div class="grid2">'+groups.map(function(g){return '<div class="card"><span class="sub">'+esc(g[0])+'</span><br><b class="qty">'+g[1].length+'</b></div>'}).join('')+'</div>'+groups.filter(function(g){return g[1].length}).map(function(g){return sec(esc(g[0]),'<div class="stack">'+g[1].map(function(d){return '<button class="card row" onclick="go(\'dress\',{c:'+jsa(d.code)+'})"><div class="av">'+esc(d.code.replace('DR-',''))+'</div><div class="col"><b>'+esc(d.desc)+'</b><span class="sub">'+esc(d.tech)+'</span></div></button>'}).join('')+'</div>')}).join('')}
 else{var M=(D.moves||[]).slice().reverse().slice(0,60);
  h=M.length?'<div class="card" style="padding:0 14px">'+M.map(function(m){var it=itemBy(m.item)||{};return '<div class="crow"><div class="col"><b>'+esc(m.type)+' · '+esc(it.name||m.item)+'</b><span class="sub">'+esc(m.date)+(m.staff?' · '+esc(m.staff):'')+(m.dress?' · '+esc(m.dress):'')+(m.notes?' · '+esc(m.notes):'')+'</span></div><b class="qty" style="font-size:16px;color:'+(m.type==='منصرف'||m.qty<0?'var(--red)':'var(--grn)')+'">'+(m.type==='منصرف'?'-':m.qty>0?'+':'')+Math.abs(m.qty)+'</b></div>'}).join('')+'</div>':'<div class="card empty">مفيش حركات لسه</div>'}
 setH(el,h)}
function vStockItem(){var x=itemBy(V.c);if(!x)return hdr('الصنف',"go('stock')")+'<div class="empty">الصنف مش موجود</div>';
 var h=hdr('<span class="code">'+esc(x.code)+'</span>',"go('stock')",admin()?'<button class="ibtn round" aria-label="تعديل الصنف" onclick="go(\'stockForm\',{c:'+jsa(x.code)+'})">'+ic('edit',18)+'</button>':'');
 h+='<div class="row" style="margin-top:16px"><div class="col"><h1>'+esc(x.name)+'</h1><span class="sub">'+esc(x.cat||'')+'</span></div>'+stockTag(x)+'</div>';
 h+='<div class="grid3" style="margin-top:14px"><div class="card"><span class="sub">الرصيد</span><br><b class="qty">'+x.qty+'</b> <span class="sub">'+esc(x.unit)+'</span></div><div class="card"><span class="sub">دخل</span><br><b>'+x.inQty+'</b></div><div class="card"><span class="sub">اتصرف</span><br><b>'+x.outQty+'</b></div></div>';
 if(admin())h+='<div class="card" style="margin-top:10px"><div class="kv"><span>حد التنبيه</span><b>'+x.min+' '+esc(x.unit)+'</b></div><div class="kv"><span>تكلفة الوحدة</span><b class="money">'+money(x.cost)+'</b></div><div class="kv"><span>قيمة الرصيد</span><b class="money">'+money(x.cost*x.qty)+'</b></div>'+(x.notes?'<div class="kv"><span>ملاحظات</span><b>'+esc(x.notes)+'</b></div>':'')+'</div>';
 h+='<div class="grid2" style="margin-top:14px"><button class="btn pri" onclick="askMove('+jsa(x.code)+',\'منصرف\')">صرف / استخدام</button>'+(admin()?'<button class="btn" onclick="askMove('+jsa(x.code)+',\'وارد\')">'+ic('plus',18)+'إضافة (شراء)</button><button class="btn" onclick="askMove('+jsa(x.code)+',\'تسوية\')">تسوية بعد الجرد</button>':'')+'</div>';
 var M=(D.moves||[]).filter(function(m){return m.item===x.code}).reverse().slice(0,30);
 h+=sec('الحركات',M.length?'<div class="card" style="padding:0 14px">'+M.map(function(m){return '<div class="crow"><div class="col"><b>'+esc(m.type)+'</b><span class="sub">'+esc(m.date)+(m.staff?' · '+esc(m.staff):'')+(m.dress?' · '+esc(m.dress):'')+(m.notes?' · '+esc(m.notes):'')+'</span></div><b class="qty" style="font-size:16px;color:'+(m.type==='منصرف'||m.qty<0?'var(--red)':'var(--grn)')+'">'+(m.type==='منصرف'?'-':m.qty>0?'+':'')+Math.abs(m.qty)+'</b></div>'}).join('')+'</div>':'<div class="card empty">مفيش حركات</div>');
 return h}
function askMove(code,type){var x=itemBy(code);var t={'منصرف':'صرف / استخدام','وارد':'إضافة للمخزن (شراء)','تسوية':'تسوية بعد الجرد'}[type];
 openSheet('<h2>'+t+'</h2><p class="sub">'+esc(x.name)+' · الرصيد '+x.qty+' '+esc(x.unit)+'</p><div class="stack"><label class="f">'+(type==='تسوية'?'الفرق (اكتب بالسالب لو ناقص، مثال -3)':'الكمية')+'<input id="mQty" type="number" inputmode="decimal" step="any" '+(type==='تسوية'?'':'min="0"')+'></label>'+(type==='وارد'?'<label class="f">سعر الوحدة<input id="mCost" type="number" inputmode="decimal" min="0" step="any" value="'+(x.cost||'')+'"></label><label class="row" style="min-height:44px;font-size:15px"><input type="checkbox" id="mExp" checked style="width:22px;height:22px"> سجّلها كمصروف (مستلزمات)</label>':'')+(type==='منصرف'?'<label class="f">لفستان (اختياري)<select id="mDress"><option value="">—</option>'+D.dresses.map(function(d){return '<option value="'+esc(d.code)+'">'+esc(d.code+' · '+d.desc)+'</option>'}).join('')+'</select></label>':'')+'<label class="f">ملاحظات<input id="mNote"></label><button class="btn pri" onclick="doMove('+jsa(code)+','+jsa(type)+')">حفظ</button><button class="btn" onclick="closeSheet()">رجوع</button></div>')}
function doMove(code,type){var o={item:code,type:type,qty:Number($('mQty').value),notes:$('mNote').value};if(!o.qty)return toast('اكتب الكمية');if($('mCost'))o.cost=$('mCost').value;if($('mExp'))o.asExpense=$('mExp').checked;if($('mDress'))o.dress=$('mDress').value;run('appStockMove',[o],function(){toast('اتسجلت الحركة ✓');closeSheet();draw()})}
function vStockForm(){var x=V.c?itemBy(V.c):null;x=x||{};
 return hdr(x.code?'تعديل '+esc(x.name):'صنف جديد',x.code?"go('stockItem',{c:"+jsa(x.code)+"})":"go('stock')")+'<form class="card stack" style="margin-top:16px" onsubmit="saveItem(event)"><label class="f">اسم الصنف *<input name="name" required maxlength="80" value="'+esc(x.name||'')+'" placeholder="مثال: أكياس تغليف فساتين"></label><div class="grid2"><label class="f">الوحدة<input name="unit" maxlength="20" value="'+esc(x.unit||'قطعة')+'"></label><label class="f">التصنيف<input name="cat" maxlength="40" value="'+esc(x.cat||'')+'" placeholder="تغليف، تنظيف، خياطة..."></label></div><div class="grid2"><label class="f">نبّهني لما يوصل لـ<input name="min" type="number" inputmode="decimal" min="0" step="any" value="'+(x.min!=null?x.min:'')+'"></label><label class="f">تكلفة الوحدة<input name="cost" type="number" inputmode="decimal" min="0" step="any" value="'+(x.cost||'')+'"></label></div>'+(x.code?'':'<label class="f">الكمية الموجودة دلوقتي<input name="qty" type="number" inputmode="decimal" min="0" step="any"></label>')+'<label class="f">ملاحظات<input name="notes" maxlength="200" value="'+esc(x.notes||'')+'"></label><button class="btn pri" type="submit">حفظ</button></form>'}
function saveItem(e){e.preventDefault();var f=e.target,o={code:V.c||''};['name','unit','cat','min','cost','notes'].forEach(function(k){o[k]=f[k].value});if(f.qty)o.qty=f.qty.value;run('appSaveStockItem',[o],function(r){toast('اتحفظ ✓');go('stockItem',{c:r.code})})}

load();
</script>

<div id="inst" style="display:none;position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;background:#2A2216;color:#fff;border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.7"><button aria-label="إغلاق" onclick="closeInst()" style="position:absolute;top:4px;left:6px;width:40px;height:40px;background:none;border:0;color:#fff;font-size:22px">×</button><span id="instTxt">نزّل التطبيق على موبايلك علشان يفتح بأيقونة زي أي تطبيق.</span><button id="instBtn" onclick="doInstall()" style="display:block;width:100%;margin-top:10px;background:linear-gradient(135deg,#B8892A,#7E5B12);color:#fff;border:0;border-radius:10px;padding:12px;font-weight:700">تثبيت التطبيق</button></div>
<script>
var deferredI=null,standaloneI=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true,closedI=lsGet('instClosed')==='1';
function closeInst(){document.getElementById('inst').style.display='none';lsSet('instClosed','1')}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredI=e;if(!standaloneI&&!closedI)document.getElementById('inst').style.display='block'});
function doInstall(){if(!deferredI)return;deferredI.prompt();deferredI.userChoice.then(function(){deferredI=null;document.getElementById('inst').style.display='none'})}
window.addEventListener('appinstalled',function(){document.getElementById('inst').style.display='none'});
if(!standaloneI&&!closedI&&/iphone|ipad|ipod/i.test(navigator.userAgent)){setTimeout(function(){document.getElementById('instTxt').textContent='علشان تنزّل التطبيق على الآيفون: دوس زرار المشاركة ⬆️ تحت، وبعدين «إضافة إلى الشاشة الرئيسية» Add to Home Screen.';document.getElementById('instBtn').style.display='none';document.getElementById('inst').style.display='block'},4000)}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
</script>
</body>
